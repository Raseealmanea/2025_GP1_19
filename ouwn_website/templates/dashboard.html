<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard - Medical Coding Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://kit.fontawesome.com/a2d9d6c9c4.js" crossorigin="anonymous"></script>
    <script src="/static/theme.js" defer></script>
</head>
<body>
    {% include "header.html" %}
    <div id="banner" class="banner"></div>

    <!-- Breadcrumb -->
    <nav class="ouwn-breadcrumb-bar" role="navigation" aria-label="Breadcrumb">
        <div class="ouwn-crumbs">
            <a class="crumb" href="{{ url_for('dashboard') }}">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>
        </div>
    </nav>

    <!-- Toast Message -->
    {% if msg_text %}
    <div id="toast" class="toast show">
        <i class="fa-solid fa-circle-check"></i>
        <span>{{ msg_text }}</span>
    </div>
    <script>
        setTimeout(() => {
            const toast = document.getElementById('toast');
            if (toast) toast.classList.remove('show');
        }, 3500);
        window.history.replaceState({}, document.title, window.location.pathname);
    </script>
    {% endif %}
    
<div class="list-actions">
<div class="header-buttons">
                <button class="btn-primary" onclick="location.href='{{ url_for('add_patient') }}'">
                    <i class="fa-solid fa-user-plus"></i> Add Patient
                </button>
            </div>

    <!-- Live Search -->
<div class="search-bar">
    <label>Search:</label>

    <input type="text" id="unifiedSearchInput" placeholder="Enter search value">

    <select id="searchType">
  <option value="name">Name</option>
  <option value="id">ID</option>
  <option value="yob">Year of Birth</option>
  <option value="icd">ICD Code</option>
</select>
</div>
            <!-- Sort Controls -->
<div class="sort-bar">
  <label>Sort by:</label>

<select id="sortBy">
  <option value="">-- Select --</option>
  <option value="name_asc">First Name (A → Z)</option>
  <option value="name_desc">First Name (Z → A)</option>
  <option value="age_young">Age (Younger first)</option>
  <option value="age_old">Age (Older first)</option>
  <option value="icd_date">ICD Date (Earliest first)</option>
</select>
</div>
</div>

    <!-- patient list -->
    <main class="main-content">
        <div class="container">
            <div class="title-bar">
                <div class="title-bar-line"></div>
                <h2 class="section-title">Patient List</h2>
                <div class="title-bar-line-fade"></div>
            </div>

            {% if patients %}
            <div class="patient-grid">
                {% for p in patients %}
                <div class="patient-card" id="patient-{{ p.ID }}" data-name="{{ p.FullName }}" data-id="{{ p.ID }}">
                    <div class="card-corner"></div>
                    <div class="card-content">
                        <h3 class="patient-name">{{ p.FullName }}</h3>
                        <div class="patient-id-row">
                            <span class="id-label">Patient ID</span>
                            <span class="patient-id">{{ p.ID }}</span>
                        </div>
                        <button class="btn-secondary" 
                            onclick="location.href='{{ url_for('add_note') }}?pid={{ p.ID }}'">
                            <i class="fa-solid fa-file-medical"></i> Add Medical Notes
                        </button>
                        <button class="btn-secondary"
                            onclick="location.href='{{ url_for('view_patient', pid=p.ID) }}'">
                            <i class="fa-solid fa-eye"></i> View Patient
                        </button>
                        <button type="button" class="btn-danger delete-btn" data-id="{{ p.ID }}">
                            <i class="fa-solid fa-trash"></i> Delete Patient
                        </button>
                    </div>
                </div>
                {% endfor %}
            </div>
            {% else %}
            <p>No patients found.</p>
            {% endif %}
        </div>
        
    </main>
    <!-- Custom Confirm Modal -->
<div id="confirmModal" class="confirm-modal">
  <div class="confirm-box">
    <h3 class="confirm-title">
      <i class="fa-solid fa-triangle-exclamation"></i>
      Confirm deletion
    </h3>

    <p id="confirmMessage" class="confirm-message"></p>

    <div class="confirm-actions">
      <button type="button" id="confirmCancel" class="btn-secondary">Cancel</button>
      <button type="button" id="confirmOk" class="btn-danger">Delete</button>
    </div>
  </div>
</div>


    <footer>
        <p>&copy; 2025 OuwN. All Rights Reserved.</p>
    </footer>
    <script>
/* ========= Banner (your existing CSS) ========= */
function showBanner(message, type = "success") {
  const banner = document.getElementById("banner");
  if (!banner) return;

  const icon =
    type === "success"
      ? '<i class="fa-solid fa-circle-check"></i>'
      : '<i class="fa-solid fa-circle-exclamation"></i>';

  banner.innerHTML = `${icon} <span>${message}</span>`;
  banner.className = `banner show ${type}`;

  setTimeout(() => {
    banner.classList.remove("show");
  }, 3500);
}

/* ========= Custom Confirm (stylable) ========= */
function customConfirm(message) {
  return new Promise((resolve) => {
    const modal = document.getElementById("confirmModal");
    const msg = document.getElementById("confirmMessage");
    const okBtn = document.getElementById("confirmOk");
    const cancelBtn = document.getElementById("confirmCancel");

    msg.textContent = message;
    modal.classList.add("show");

    const cleanup = () => {
      modal.classList.remove("show");
      okBtn.onclick = null;
      cancelBtn.onclick = null;
      modal.onclick = null;
      document.onkeydown = null;
    };

    okBtn.onclick = () => { cleanup(); resolve(true); };
    cancelBtn.onclick = () => { cleanup(); resolve(false); };

    // click outside closes (cancel)
    modal.onclick = (e) => {
      if (e.target === modal) { cleanup(); resolve(false); }
    };

    // ESC closes (cancel)
    document.onkeydown = (e) => {
      if (e.key === "Escape") { cleanup(); resolve(false); }
    };
  });
}

/* ========= Delete Patient ========= */
document.addEventListener("click", async (e) => {
  const btn = e.target.closest(".delete-btn");
  if (!btn) return;

  const pid = (btn.dataset.id || "").trim();
  if (!pid) {
    showBanner("Missing patient ID.", "error");
    return;
  }

  const ok = await customConfirm("Delete this patient and all medical notes?");
  if (!ok) return;

  btn.disabled = true;

  try {
    const res = await fetch(`/delete_patient/${encodeURIComponent(pid)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" }
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      showBanner(data.error || data.message || "Delete failed.", "error");
      btn.disabled = false;
      return;
    }

    const card = document.getElementById(`patient-${pid}`);
    if (card) card.remove();

    showBanner("Patient deleted successfully.", "success");

  } catch (err) {
    showBanner("Network error. Please try again.", "error");
    btn.disabled = false;
  }
});
// Live Search + Sort (AJAX) 
const unifiedSearchInput = document.getElementById("unifiedSearchInput");
const searchType = document.getElementById("searchType");
const sortBy = document.getElementById("sortBy");           // <-- IMPORTANT
const patientGrid = document.querySelector(".patient-grid");

let searchTimeout = null;
let activeAbortController = null;
let lastRequestSeq = 0;

const initialGridHTML = patientGrid ? patientGrid.innerHTML : "";

function renderPatients(patients) {
  if (!patientGrid) return;

  patientGrid.innerHTML = "";

  if (!patients || !patients.length) {
    patientGrid.innerHTML = `
      <div class="no-results">
        <i class="fa-solid fa-magnifying-glass"></i>
        No matching patients found
      </div>
    `;
    return;
  }

  patients.forEach(p => {
    const card = document.createElement("div");
    card.className = "patient-card";
    card.id = `patient-${p.ID}`;
    card.dataset.name = p.FullName;
    card.dataset.id = p.ID;

    card.innerHTML = `
  <div class="card-corner"></div>
  <div class="card-content">
    <h3 class="patient-name">${p.FullName}</h3>
    <div class="patient-id-row">
      <span class="id-label">Patient ID</span>
      <span class="patient-id">${p.ID}</span>
    </div>

    <button class="btn-secondary" onclick="location.href='/MedicalNotes?pid=${p.ID}'">
      <i class="fa-solid fa-file-medical"></i> Add Medical Notes
    </button>

    <button class="btn-secondary" onclick="location.href='/view_patient/${p.ID}'">
      <i class="fa-solid fa-eye"></i> View Patient
    </button>

    <button type="button" class="btn-danger delete-btn" data-id="${p.ID}">
      <i class="fa-solid fa-trash"></i> Delete Patient
    </button>
  </div>
`;

    patientGrid.appendChild(card);
  });
}

function validateUnifiedInput() {
  let value = unifiedSearchInput.value;
  if (!value) return;

  const type = searchType.value;

  if (type === "name") {
    value = value.replace(/[^a-zA-Z]/g, "");
  } else if (type === "id") {
    value = value.replace(/[^0-9]/g, "");
  } else if (type === "yob") {
  value = value.replace(/[^0-9]/g, "");
  if (value.length > 4) value = value.slice(0, 4);
  } else if (type === "icd") {
    value = value.replace(/[^a-zA-Z0-9]/g, "");
    if (value.length > 0 && !/^[a-zA-Z]/.test(value)) value = "";
    value = value.toUpperCase();
  }

  unifiedSearchInput.value = value;
}

async function fetchPatients() {
  if (!patientGrid) return;

  
  clearTimeout(searchTimeout);

  searchTimeout = setTimeout(async () => {
    const rawValue = unifiedSearchInput.value;
    const value = rawValue.trim();
    const type = searchType.value;

 
if (!value) {
  if (activeAbortController) activeAbortController.abort();

  const sort = sortBy ? (sortBy.value || "") : "";

  if (!sort) {
    patientGrid.innerHTML = initialGridHTML;
    return;
  }


  activeAbortController = new AbortController();
  const thisSeq = ++lastRequestSeq;

  try {
    const params = new URLSearchParams({ search: "", yob: "", icd: "", sort });
    const res = await fetch(`/api/patients?${params.toString()}`, {
      signal: activeAbortController.signal
    });

    if (!res.ok) return;
    const data = await res.json();

    if (thisSeq !== lastRequestSeq) return;
    if (unifiedSearchInput.value.trim()) return; // user typed again

    renderPatients(data);
  } catch (err) {
    if (err && err.name === "AbortError") return;
    console.error(err);
  }

  return;
}


    let search = "";
    let yob = "";
    let icd = "";

    if (type === "name" || type === "id") search = value;
    if (type === "yob") yob = value;
    if (type === "icd") icd = value;

    const sort = sortBy ? (sortBy.value || "") : "";

    if (activeAbortController) activeAbortController.abort();
    activeAbortController = new AbortController();
    const thisSeq = ++lastRequestSeq;

    try {
      const params = new URLSearchParams({ search, yob, icd, sort });

      const res = await fetch(`/api/patients?${params.toString()}`, {
        signal: activeAbortController.signal
      });

      if (!res.ok) return;

      const data = await res.json();

      if (thisSeq !== lastRequestSeq) return;

      if (!unifiedSearchInput.value.trim()) return;

      renderPatients(data);

    } catch (err) {
      if (err && err.name === "AbortError") return;
      console.error(err);
    }
  }, 150);
}

unifiedSearchInput.addEventListener("input", () => {
  validateUnifiedInput();
  fetchPatients();
});

searchType.addEventListener("change", () => {
  unifiedSearchInput.value = "";
  if (activeAbortController) activeAbortController.abort();
  if (patientGrid) patientGrid.innerHTML = initialGridHTML;
});

if (sortBy) {
  sortBy.addEventListener("change", fetchPatients);
}      
</script>
</body>
</html>
