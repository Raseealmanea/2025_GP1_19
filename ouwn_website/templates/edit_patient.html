<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit Patient</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="/static/theme.js" defer></script>
<style>
  .actions-bar{
    display:flex;
    justify-content:flex-end;   /* buttons on the right */
    gap:10px;
    margin-top: 14px;
  }
  /* Force invalid fields to stay red even when focused */
input.is-invalid,
select.is-invalid,
textarea.is-invalid{
  border-color: #dc3545 !important;
  outline: none !important;
}

input.is-invalid:focus,
select.is-invalid:focus,
textarea.is-invalid:focus,
input.is-invalid:focus-visible,
select.is-invalid:focus-visible,
textarea.is-invalid:focus-visible{
  border-color: #dc3545 !important;
  box-shadow: 0 0 0 3px rgba(220, 53, 69, .20) !important;
  outline: none !important;
}

/* (Optional) valid focus style so green looks consistent too */
input.is-valid:focus,
select.is-valid:focus,
textarea.is-valid:focus{
  box-shadow: 0 0 0 3px rgba(25, 135, 84, .18) !important;
  outline: none !important;
}
</style>

<style>
  .confirm-overlay{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    padding: 18px;
  }
  .confirm-overlay.show{ display:flex; }

  .confirm-modal-box{
    width: min(520px, 96vw);
    background: #fff;
    color: #2d004d;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    padding: 18px 18px 14px;
    transform: translateY(8px);
    opacity: 0;
    transition: opacity .18s ease, transform .18s ease;
  }
  .confirm-overlay.show .confirm-modal-box{
    opacity: 1;
    transform: translateY(0);
  }

  .confirm-modal-title{ margin: 0 0 8px; font-size: 18px; }
  .confirm-modal-text{ margin: 0 0 14px; opacity: .85; line-height: 1.4; }

  .confirm-modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
  }

  .cbtn{
    border: none;
    border-radius: 12px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 14px;
  }
  .cbtn.cancel{ background: #e6e6e6; color: #333; }
  .cbtn.cancel:hover{ filter: brightness(.97); }
  .cbtn.confirm{ background: #9975C1; color: #fff; }
  .cbtn.confirm:hover{ filter: brightness(.95); }
</style>
</head>

<body class="form-page medical-note edit-patient">
{% include "header.html" %}

<nav class="ouwn-breadcrumb-bar" role="navigation" aria-label="Breadcrumb">
  <div class="ouwn-crumbs">
    <!-- Dashboard -->
    <a class="crumb" href="{{ url_for('dashboard') }}">
      <i class="fa-solid fa-house"></i>
      <span>Dashboard</span>
    </a>

    <span class="sep" aria-hidden="true">/</span>

    <!-- View Patient -->
    <a class="crumb" href="{{ url_for('view_patient', pid=pid) }}">
      <i class="fa-solid fa-eye"></i>
      <span>View patient</span>
    </a>

    <span class="sep" aria-hidden="true">/</span>

    <!-- Current page -->
    <span class="crumb current" aria-current="page">
      <i class="fa-solid fa-user-pen"></i>
      <span>Edit patient info</span>
    </span>
  </div>
</nav>

<main class="container card" style="padding:24px 24px 16px;">
  <h1 style="margin-top:0">Edit Patient</h1>


<!-- Confirm Modal (same as notes) -->
<div id="confirmOverlay" class="confirm-overlay" aria-hidden="true">
  <div class="confirm-modal-box" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h3 id="confirmTitle" class="confirm-modal-title">Confirm changes</h3>
    <p id="confirmText" class="confirm-modal-text">Are you sure you want to save?</p>

    <div class="confirm-modal-actions">
      <button type="button" id="confirmCancelBtn" class="cbtn cancel">Cancel</button>
      <button type="button" id="confirmOkBtn" class="cbtn confirm">Confirm</button>
    </div>
  </div>
</div>

  {% if errors %}
  <div class="alert error" style="margin-bottom:16px">
    <ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
  </div>
  {% endif %}


<form method="POST" action="{{ url_for('edit_patient', pid=pid) }}" novalidate>

  <!-- Full Name -->
    <div class='row'>
      <label for='full_name'>Full Name<span class='required'>*</span></label>
      <div class='control'>
        <input id='full_name' name='full_name' type='text' required
               value="{{ form.full_name }}">
        <div class='feedback'></div>
      </div>
    </div>

    <!-- Date of Birth -->
    <div class='row'>
      <label for='dob'>Date of Birth<span class='required'>*</span></label>
      <div class='control'>
        <input id='dob' name='dob' type='date' required
               value="{{ form.dob }}">
        <div class='feedback'></div>
      </div>
    </div>

    <!-- Gender -->
    <div class="row">
      <label for="gender">Gender<span class="required">*</span></label>
      <div class="control">
        <select id="gender" name="gender" required>
          <option value="">Choose</option>
          <option value="M" {% if form.gender == 'M' %}selected{% endif %}>Male</option>
          <option value="F" {% if form.gender == 'F' %}selected{% endif %}>Female</option>
        </select>
        <div class="feedback"></div>
      </div>
    </div>

    <!-- National ID (uneditable) -->
    <div class='row'>
      <label for='ID'>National ID / Iqama<span class='required'>*</span></label>
      <div class='control'>
        <input id='ID' name='ID' type='text' value="{{ pid }}" disabled>
        <input type="hidden" name="pid" value="{{ pid }}">
        <div class='feedback'></div>
      </div>
    </div>

    <!-- Phone -->
    <div class='row'>
      <label for='phone'>Phone<span class='required'>*</span></label>
      <div class='control'>
        <input id='phone' name='phone' type='tel' maxlength='10' minlength='10' required
               oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10);"
               value="{{ form.phone }}">
        <div class='feedback'></div>
      </div>
    </div>

    <!-- Email -->
    <div class='row'>
      <label for='email'>Email<span class='required'>*</span></label>
      <div class='control'>
        <input id='email' name='email' type='email' required
               value="{{ form.email }}">
        <div class='feedback'></div>
      </div>
    </div>

    <!-- Address -->
    <div class='row'>
      <label for='address'>Address<span class='required'>*</span></label>
      <div class='control'>
        <input id='address' name='address' type='text' required
               value="{{ form.address }}">
        <div class='feedback'></div>
      </div>
    </div>

    <!-- Blood Type -->
    <div class="row">
      <label for="blood_type">Blood Type<span class="required">*</span></label>
      <div class="control">
        <select id="blood_type" name="blood_type" required>
          <option value="">Select</option>
          {% for b in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}
            <option value="{{ b }}" {% if form.blood_type == b %}selected{% endif %}>{{ b }}</option>
          {% endfor %}
        </select>
        <div class="feedback"></div>
      </div>
    </div>

    <div class="actions-bar">
  <button type="submit" id="saveBtn">
    <i class="fa-solid fa-floppy-disk"></i> Save Changes
  </button>

  <button type="button" class="btn-secondary"
          onclick="location.href='{{ url_for('view_patient', pid=pid) }}'">
    Cancel
  </button>
</div>

  </form>
</main>



<script>
const touched = new Set();
let forceShowErrors = false;
let showValidStyles = true;

function setValidity(input, ok, msg){
  const fb = input.closest('.control')?.querySelector('.feedback');
  const shouldShow = forceShowErrors || touched.has(input.id);

  if (!shouldShow) {
    input.classList.remove('is-valid', 'is-invalid');
    if (fb) {
      fb.textContent = "";
      fb.classList.remove("valid");
    }
    return;
  }

input.classList.toggle('is-valid', ok && showValidStyles);
input.classList.toggle('is-invalid', !ok);

  if (fb) {
    fb.textContent = ok ? "" : (msg || "");
    fb.classList.toggle('valid', ok);
  }
}

function markTouched(el){
  if (!el || !el.id) return;
  touched.add(el.id);
}

const dob = document.getElementById('dob');
function checkDob() {
  if (!dob) return false;
  const v = dob.value;

  if (!v) { setValidity(dob, false, "Date of Birth is required."); return false; }

  const d = new Date(v + "T00:00:00");
  if (isNaN(d.getTime())) { setValidity(dob, false, "Invalid date."); return false; }

  const now = new Date();
  if (d > now) { setValidity(dob, false, "Date of Birth cannot be in the future."); return false; }

  let age = now.getFullYear() - d.getFullYear();
  const mdNow = (now.getMonth()+1)*100 + now.getDate();
  const mdDob = (d.getMonth()+1)*100 + d.getDate();
  if (mdDob > mdNow) age--;

  if (age > 130) { setValidity(dob, false, "Age cannot exceed 130 years."); return false; }

  setValidity(dob, true);
  return true;
}

if (dob) {
  dob.addEventListener('input', () => { markTouched(dob); checkDob(); });
  dob.addEventListener('change', () => { markTouched(dob); checkDob(); });
  dob.addEventListener('blur',  () => { markTouched(dob); checkDob(); });
}

const phone = document.getElementById('phone');
function checkPhone() {
  if (!phone) return false;
  const ok = /^05\d{8}$/.test(phone.value.trim());
  setValidity(phone, ok, "Must start with 05 and be 10 digits.");
  return ok;
}
if (phone) {
  phone.addEventListener('input', () => { markTouched(phone); checkPhone(); });
  phone.addEventListener('blur',  () => { markTouched(phone); checkPhone(); });
}

const email = document.getElementById('email');
function checkEmail() {
  if (!email) return false;
  const ok = /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i.test(email.value.trim());
  setValidity(email, ok, "Invalid email format.");
  return ok;
}
if (email) {
  email.addEventListener('input', () => { markTouched(email); checkEmail(); });
  email.addEventListener('blur',  () => { markTouched(email); checkEmail(); });
}

function checkRequired(input, message) {
  if (!input) return false;
  const ok = !!input.value && input.value.trim() !== "";
  setValidity(input, ok, message || "This field is required.");
  return ok;
}

function scrollToFirstInvalid(formEl) {
  const first = formEl.querySelector(".is-invalid");
  if (first) {
    first.scrollIntoView({ behavior: "smooth", block: "center" });
    first.focus({ preventScroll: true });
  }
}

/* ---------- Confirm modal ---------- */
function confirmModal(message){
  return new Promise((resolve) => {
    const overlay = document.getElementById("confirmOverlay");
    const text = document.getElementById("confirmText");
    const okBtn = document.getElementById("confirmOkBtn");
    const cancelBtn = document.getElementById("confirmCancelBtn");

    if (!overlay || !text || !okBtn || !cancelBtn) return resolve(true);

    text.textContent = message;

    const cleanup = () => {
      overlay.classList.remove("show");
      overlay.setAttribute("aria-hidden", "true");
      okBtn.onclick = null;
      cancelBtn.onclick = null;
      overlay.onclick = null;
    };

    okBtn.onclick = () => { cleanup(); resolve(true); };
    cancelBtn.onclick = () => { cleanup(); resolve(false); };

    overlay.onclick = (e) => {
      if (e.target === overlay) { cleanup(); resolve(false); }
    };

    const onKey = (e) => {
      if (e.key === "Escape") {
        document.removeEventListener("keydown", onKey);
        cleanup();
        resolve(false);
      }
    };
    document.addEventListener("keydown", onKey);

    overlay.setAttribute("aria-hidden", "false");
    overlay.classList.add("show");
  });
}

/* ---------- Change detection ---------- */
let originalPatient = null;

function snapPatient(){
  const get = (id) => (document.getElementById(id)?.value || "").trim();
  originalPatient = {
    full_name: get("full_name"),
    dob: get("dob"),
    gender: get("gender"),
    phone: get("phone"),
    email: get("email").toLowerCase(),     // normalize
    address: get("address"),
    blood_type: get("blood_type")
  };
}

function isPatientChanged(){
  if (!originalPatient) return true;
  const get = (id) => (document.getElementById(id)?.value || "").trim();
  const now = {
    full_name: get("full_name"),
    dob: get("dob"),
    gender: get("gender"),
    phone: get("phone"),
    email: get("email").toLowerCase(),
    address: get("address"),
    blood_type: get("blood_type")
  };

  return Object.keys(originalPatient).some(k => (now[k] || "") !== (originalPatient[k] || ""));
}



/* ---------- Your existing validation code stays ---------- */
/* (keep your touched/checkDob/checkPhone/checkEmail/checkRequired/scrollToFirstInvalid exactly as you have them) */

window.addEventListener("load", () => {
  const form = document.querySelector("form");
  if (!form) return;

  snapPatient(); // ✅ snapshot initial values

  form.addEventListener("submit", async (e) => {
    forceShowErrors = true;
    showValidStyles = false;

    let ok = true;
    const fullName = document.getElementById("full_name");
    const gender   = document.getElementById("gender");
    const address  = document.getElementById("address");
    const blood    = document.getElementById("blood_type");

    ok = checkRequired(fullName, "Full Name is required.") && ok;
    ok = checkDob() && ok;
    ok = checkRequired(gender, "Gender is required.") && ok;
    ok = checkPhone() && ok;
    ok = checkEmail() && ok;
    ok = checkRequired(address, "Address is required.") && ok;
    ok = checkRequired(blood, "Blood Type is required.") && ok;

    if (!ok) {
      e.preventDefault();
      scrollToFirstInvalid(form);
      return;
    }

    e.preventDefault();

    const changed = isPatientChanged();
    if (!changed) {
      if (form.dataset.submitting === "1") return;
      form.dataset.submitting = "1";

      const action = new URL(form.action, window.location.origin);
      

      HTMLFormElement.prototype.submit.call(form);
      return;
    }

    const okConfirm = await confirmModal("Save changes to patient info?");
    if (!okConfirm) return;

    if (form.dataset.submitting === "1") return;
    form.dataset.submitting = "1";

    const btn = document.getElementById("saveBtn");
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Saving...`;
    }

    const action = new URL(form.action, window.location.origin);

    HTMLFormElement.prototype.submit.call(form);
  });
});
</script>
</body>
</html>
